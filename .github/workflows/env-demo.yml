name: Environment Variables Demo Pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:
# ========================================================
# 1. WORKFLOW LEVEL (Global across all jobs)
# ========================================================
env:
  APP_NAME: "DevSecOps-Engine"
  APP_ENV: "development"          # Default Global Environment
  PORT: 8080
  LOG_LEVEL: "debug"
jobs:
  test-and-audit:
    name: 🧪 Variable Scoping & Shell Script Audit
    runs-on: ubuntu-latest
    # ========================================================
    # 2. JOB LEVEL (Available to all steps in this job)
    # ========================================================
    env:
      JOB_OWNER: "Manoj DevOps"
      APP_ENV: "staging"          # Overrides Global 'development'
    steps:
      - name: 📥 Checkout repository source code
        uses: actions/checkout@v4
      - name: 🌐 1. Test Job-Level Scoping with Shell Script
        run: |
          chmod +x app-config.sh
          ./app-config.sh
      - name: ⚡ 2. Test Step-Level Override (Precedence Rule)
        # ========================================================
        # 3. STEP LEVEL (Highest Priority - Specific to this step)
        # ========================================================
        env:
          APP_ENV: "production"   # Overrides Job-level & Workflow-level!
        run: |
          echo "=========================================="
          echo "🔥 RUNNING IN STEP OVERRIDE MODE:"
          ./app-config.sh
          echo "=========================================="
      - name: 🔍 3. Inspect GitHub Default System Environment Variables
        run: |
          echo "=========================================="
          echo "🤖 CI System Flag: $CI"
          echo "📂 Runner Workspace: $GITHUB_WORKSPACE"
          echo "🆔 Pipeline Run ID: $GITHUB_RUN_ID"
          echo "🏢 GitHub Repository: $GITHUB_REPOSITORY"
          echo "=========================================="
