name: Shared Cloud Deployment Engine

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Microservice Name'
        required: true
        type: string
      environment:
        description: 'Target Deployment Environment'
        required: true
        type: string
      image_tag:
        description: 'Container Image Tag'
        required: true
        type: string
      replicas:
        description: 'Pod / Server Replica Count'
        required: false
        default: 3
        type: number
      run_security_scan:
        description: 'Run Trivy Security Scan'
        required: false
        default: true
        type: boolean
    outputs:
      live_url:
        description: 'Generated Deployment Endpoint'
        value: ${{ jobs.execute-deploy.outputs.ENDPOINT }}
      deploy_status:
        description: 'Deployment Status Result'
        value: ${{ jobs.execute-deploy.outputs.STATUS }}

jobs:
  execute-deploy:
    name: 🌐 Cloud Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      ENDPOINT: ${{ steps.deploy_step.outputs.ENDPOINT }}
      STATUS: ${{ steps.deploy_step.outputs.STATUS }}

    steps:
      - name: 🛡️ Security Audit
        if: inputs.run_security_scan == true
        run: |
          echo "=========================================="
          echo "🛡️ RUNNING AUTOMATED SECURITY VULNERABILITY SCAN..."
          echo "📦 Service: ${{ inputs.service_name }}"
          echo "🏷️ Image Tag: ${{ inputs.image_tag }}"
          echo "✅ Security Scan Passed: 0 Critical / 0 High Vulnerabilities"
          echo "=========================================="

      - name: 🚀 Cloud Infrastructure Provisioning
        id: deploy_step
        run: |
          echo "=========================================="
          echo "🚀 [REUSABLE ENGINE ACTIVE]..."
          echo "🌍 Target Environment: ${{ inputs.environment }}"
          echo "📱 Service Name: ${{ inputs.service_name }}"
          echo "⚙️ Scaling Replicas: ${{ inputs.replicas }} Pods"
          echo "👤 Caller Actor: ${{ github.actor }}"
          
          # Emitting dynamic output values back to calling workflow
          LIVE_ENDPOINT="https://${{ inputs.environment }}.${{ inputs.service_name }}.internal.cloud"
          echo "ENDPOINT=$LIVE_ENDPOINT" >> $GITHUB_OUTPUT
          echo "STATUS=HEALTHY" >> $GITHUB_OUTPUT
          
          echo "✅ Deployed successfully! Endpoint: $LIVE_ENDPOINT"
          echo "=========================================="
