name: Enterprise Multi-Branch & Notification Lifecycle

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. FEATURE BRANCHES (Static Code Analysis)
  # ========================================================
  code-analysis:
    name: 🔍 Static Code Analysis (feature/** branches)
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🧪 Execute Static Code Analysis
        run: |
          echo "=========================================="
          echo "🔍 Running SonarQube & Static Analysis..."
          echo "🌿 Feature Branch: ${{ github.ref_name }}"
          echo "✅ Code quality passed with 0 bugs!"
          echo "=========================================="

  # ========================================================
  # 2. DEVELOP BRANCH (Deploy to Development)
  # ========================================================
  deploy-to-dev:
    name: 🧪 Deploy to Dev Environment (develop branch)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🌐 Deploying to Development Server
        run: |
          echo "=========================================="
          echo "🧪 DEPLOYING TO DEVELOPMENT ENVIRONMENT..."
          echo "🌿 Branch: develop"
          echo "✅ Dev Deployment Active!"
          echo "=========================================="

  # ========================================================
  # 3. MAIN BRANCH (Deploy to Production)
  # ========================================================
  deploy-to-prod:
    name: 🚀 Deploy to Production Environment (main branch)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🚀 Deploying to Production Server
        run: |
          echo "=========================================="
          echo "🚨 PRODUCTION DEPLOYMENT ACTIVE!"
          echo "🌿 Branch: main"
          echo "👤 Approved & Deployed by: ${{ github.actor }}"
          echo "✅ Production Live & Synced!"
          echo "=========================================="

      # 🔔 4. SUCCESS NOTIFICATION (Step-Level if: success())
      - name: 🟢 Send Success Notification
        if: success()
        run: |
          echo "=========================================="
          echo "🟢 [SUCCESS NOTIFICATION SENT]:"
          echo "📢 Deployment succeeded! Alerting team channel on Slack/Teams."
          echo "=========================================="

      # 🔴 5. FAILURE NOTIFICATION (Step-Level if: failure())
      - name: 🔴 Send Failure Notification
        if: failure()
        run: |
          echo "=========================================="
          echo "🔴 [FAILURE NOTIFICATION SENT]:"
          echo "🚨 Deployment failed! Sending critical alert to On-Call DevOps Engineer."
          echo "=========================================="
