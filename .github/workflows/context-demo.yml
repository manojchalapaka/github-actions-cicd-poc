name: Context Variables Demo Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  context-audit:
    name: 🔍 GitHub Context & Runner Deep-Dive Audit
    runs-on: ubuntu-latest

    steps:
      - name: 👤 1. Inspect Individual GitHub Contexts
        run: |
          echo "=========================================="
          echo "🚀 Event Name: ${{ github.event_name }}"
          echo "👤 Triggered by Actor: ${{ github.actor }}"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Active Branch: ${{ github.ref_name }}"
          echo "🔖 Git Ref Full Path: ${{ github.ref }}"
          echo "🆔 Commit SHA: ${{ github.sha }}"
          echo "📋 Workflow Name: ${{ github.workflow }}"
          echo "=========================================="

      - name: 📜 2. Print All Variables Under github Context (JSON Dump)
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "=========================================="
          echo "🔍 COMPLETE GITHUB CONTEXT DUMP:"
          echo "$GITHUB_CONTEXT"
          echo "=========================================="

      - name: 🖥️ 3. Inspect System & Runner Environment Variables
        run: |
          echo "=========================================="
          echo "🖥️ Runner OS: ${{ runner.os }}"
          echo "⚙️ Runner Architecture: ${{ runner.arch }}"
          echo "📂 GitHub Workspace (Linux Env): $GITHUB_WORKSPACE"
          echo "🔑 Commit SHA (Linux Env): $GITHUB_SHA"
          echo "🆔 Run Number: $GITHUB_RUN_NUMBER"
          echo "=========================================="
