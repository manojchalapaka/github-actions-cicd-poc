name: Global Enterprise Orchestrator Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # STAGE 1: LOCAL BUILD JOB
  # ========================================================
  build-and-package:
    name: 🔨 Stage 1 - Build & Container Package
    runs-on: ubuntu-latest
    outputs:
      BUILT_TAG: ${{ steps.build.outputs.TAG }}
    steps:
      - name: ⚙️ Packaging Microservice
        id: build
        run: |
          echo "=========================================="
          echo "🔨 STAGE 1: Compiling application binary..."
          RELEASE_TAG="v5.2.0-release"
          echo "TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Packaged Docker Image: node-todo-app:$RELEASE_TAG"
          echo "=========================================="

  # ========================================================
  # STAGE 2: CALL REUSABLE WORKFLOW (STAGING)
  # ========================================================
  deploy-staging:
    name: 🧪 Stage 2 - Reusable Deploy to STAGING
    needs: build-and-package
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service_name: "node-todo-app"
      environment: "staging"
      image_tag: ${{ needs.build-and-package.outputs.BUILT_TAG }}
      replicas: 2
      run_security_scan: true

  # ========================================================
  # STAGE 3: CALL REUSABLE WORKFLOW (PRODUCTION)
  # ========================================================
  deploy-production:
    name: 🚀 Stage 3 - Reusable Deploy to PRODUCTION
    needs: [build-and-package, deploy-staging]
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service_name: "node-todo-app"
      environment: "production"
      image_tag: ${{ needs.build-and-package.outputs.BUILT_TAG }}
      replicas: 10
      run_security_scan: true

  # ========================================================
  # STAGE 4: POST-DEPLOYMENT LIVE AUDIT (Uses Reusable Outputs)
  # ========================================================
  live-health-audit:
    name: 🛡️ Stage 4 - Global Fleet Verification
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Verify Reusable Workflow Emitted Outputs
        run: |
          echo "=========================================="
          echo "🎉 GLOBAL DEPLOYMENT PIPELINE COMPLETE!"
          echo "🧪 Staging Live URL: ${{ needs.deploy-staging.outputs.live_url }}"
          echo "🚀 Production Live URL: ${{ needs.deploy-production.outputs.live_url }}"
          echo "📊 Production Health Status: ${{ needs.deploy-production.outputs.deploy_status }}"
          echo "✅ All fleet systems healthy and operational!"
          echo "=========================================="
