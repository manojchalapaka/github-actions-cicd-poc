name: Deploy HTML to S3
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Copy files to S3 with AWS CLI
        run: |
          aws s3 sync . s3://manoj-cicd-website-7007 --exclude ".git*" --exclude ".github*"
          echo "Website deployed: http://manoj-cicd-website-7007.s3-website-us-east-1.amazonaws.com"
