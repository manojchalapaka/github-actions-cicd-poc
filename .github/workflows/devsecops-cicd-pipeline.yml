name: GitHub Action Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  action-demo:
    name: 🚀 GitHub Marketplace Action Demo
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout the code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 📂 Verify Checked Out Repository Files
        run: |
          echo "=========================================="
          echo "📁 Current Working Directory: $(pwd)"
          echo "📄 Listing checked out repository files:"
          ls -la
          echo "=========================================="
