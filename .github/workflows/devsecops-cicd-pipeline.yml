name: Hello World

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    types:
      - opened
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Application Build
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Build Step
        run: |
          echo "=========================================="
          echo "🔨 Execution Event: ${{ github.event_name }}"
          echo "🌿 Target Branch: ${{ github.ref }}"
          echo "👤 Triggered by User: ${{ github.actor }}"
          echo "A demo build completed successfully!"
          echo "=========================================="
