name: Production Multi-Job Workflow

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  # ========================================================
  # 1. BUILD JOB
  # ========================================================
  build:
    name: 🔨 Application Build
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Compile & Validate Source
        run: |
          echo "=========================================="
          echo "🔨 STAGE 1: APPLICATION BUILD PHASE"
          echo "Triggered by: ${{ github.actor }}"
          echo "Initializing compiler and validating source..."
          echo "Build Status: SUCCESSFUL ✓"
          echo "=========================================="

  # ========================================================
  # 2. TEST JOB
  # ========================================================
  test:
    name: 🧪 Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: 🧪 Execute Unit & Integration Tests
        run: |
          echo "=========================================="
          echo "🧪 STAGE 2: TEST AUTOMATION PHASE"
          echo "Running unit test suites..."
          echo "Test Case 1 (Login Service): PASSED ✓"
          echo "Test Case 2 (API Gateway):   PASSED ✓"
          echo "Quality Gate: 100% SUCCESSFUL ✓"
          echo "=========================================="

  # ========================================================
  # 3. DEPLOY JOB
  # ========================================================
  deploy:
    name: 🚀 Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy Application Release
        run: |
          echo "=========================================="
          echo "🚀 STAGE 3: PRODUCTION DEPLOYMENT PHASE"
          echo "Target Environment: AWS Cloud Production"
          echo "Deploying artifacts to cluster..."
          echo "Health Check: HTTP 200 OK ✓"
          echo "Status: APPLICATION IS LIVE & HEALTHY!"
          echo "=========================================="
