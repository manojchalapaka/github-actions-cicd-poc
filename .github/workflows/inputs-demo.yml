name: Dynamic Workflow Inputs Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
      artifact_tag:
        description: 'Artifact Version Tag'
        required: true
        default: '2.0.1'
        type: string

jobs:
  build:
    name: 🔨 Runner 1 - Build Artifact
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Packaging Application Artifact
        run: |
          echo "=========================================="
          echo "🔨 RUNNER 1 (BUILD JOB) STARTING..."
          echo "🏷️ Building Artifact with Tag: ${{ inputs.artifact_tag }}"
          echo "👤 Triggered by User: ${{ github.actor }}"
          echo "✅ Artifact package created: my-app-${{ inputs.artifact_tag }}.tar.gz"
          echo "=========================================="

  deploy:
    name: 🚀 Runner 2 - Deploy to Environment
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Deploying to Target Server
        run: |
          echo "=========================================="
          echo "🚀 RUNNER 2 (DEPLOY JOB) STARTING..."
          echo "🎯 Target Environment Selected: ${{ inputs.environment }}"
          echo "📦 Deploying Artifact Tag: ${{ inputs.artifact_tag }}"
          
          if [ "${{ inputs.environment }}" == "prod" ]; then
            echo "🚨 PRODUCTION DEPLOYMENT: Applying strict security audits!"
          else
            echo "🧪 Non-Prod Deployment: Rapid deployment mode active."
          fi
          
          echo "✅ Successfully deployed my-app-${{ inputs.artifact_tag }} to [${{ inputs.environment }}] server!"
          echo "=========================================="
