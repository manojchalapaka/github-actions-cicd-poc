name: Enterprise Caller Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Call 1: Deploy to Development
  call-deploy-dev:
    name: 🧪 Invoke Reusable Deploy for DEV
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      target_env: "development"
      app_version: "v2.1.0-dev"

  # Call 2: Deploy to Production (Reuses the same workflow!)
  call-deploy-prod:
    name: 🚀 Invoke Reusable Deploy for PROD
    needs: call-deploy-dev
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      target_env: "production"
      app_version: "v2.1.0-prod"
