name: Job Outputs Demo Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: PRODUCER (Creates and Exports Outputs)
  # ========================================================
  job1:
    name: 🔨 Job 1 - Producer (Generate Outputs)
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.step1.outputs.VERSION }}
      build_status: ${{ steps.step1.outputs.STATUS }}

    steps:
      - name: ⚙️ Set Step and Job Outputs
        id: step1
        run: |
          echo "=========================================="
          echo "🔨 JOB 1: Setting dynamic outputs..."
          echo "VERSION=v4.0.0-release" >> $GITHUB_OUTPUT
          echo "STATUS=SUCCESSFUL" >> $GITHUB_OUTPUT
          echo "✅ Outputs registered into GITHUB_OUTPUT!"
          echo "=========================================="

      - name: 🔗 Consume Output within Same Job (Step to Step)
        run: |
          echo "=========================================="
          echo "📦 Received within Job 1: ${{ steps.step1.outputs.VERSION }}"
          echo "=========================================="

  # ========================================================
  # JOB 2: CONSUMER (Uses Outputs from Job 1)
  # ========================================================
  job2:
    name: 🚀 Job 2 - Consumer (Use Job 1 Outputs)
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Print Outputs from Job 1 (Job to Job)
        run: |
          echo "=========================================="
          echo "🚀 JOB 2: Consuming data from Job 1:"
          echo "🎯 Received App Version: ${{ needs.job1.outputs.app_version }}"
          echo "📊 Received Build Status: ${{ needs.job1.outputs.build_status }}"
          echo "✅ Data successfully shared across jobs!"
          echo "=========================================="
